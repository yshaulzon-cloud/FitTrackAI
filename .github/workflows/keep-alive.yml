# Pings the Render free-tier API every ~10 minutes so it doesn't go to sleep
# (Render sleeps free services after 15 min without traffic).
# Public repo = unlimited Actions minutes. GitHub disables scheduled workflows
# after 60 days without repo activity; re-enable from the Actions tab if so.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://bodysync-api-admm.onrender.com/health
